# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
# NOTE: every number must be a float (1.0, not 1) or move_group dies with InvalidParameterTypeException.
#
# max_velocity 0.5 rad/s: below the mycobot_driver cap max_joint_vel_deg 30 (0.52 rad/s), so the
# driver does not stretch the trajectory and MoveIt's execution monitoring is not tripped.

default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3

joint_limits:
  gripper_controller:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint2_to_joint1:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint3_to_joint2:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint4_to_joint3:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint5_to_joint4:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint6_to_joint5:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint6output_to_joint6:
    # camera cable: keep joint6 within +-90 deg (same window as the calibration nodes)
    has_position_limits: true
    min_position: -1.5708
    max_position: 1.5708
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0
