선반 배치 기준점

모든 좌표는 로봇 베이스 중심(J1 축) 기준입니다. 다만 J1 축은 실제로 자를 대기 어려우니, 책상 모서리를 기준으로 놓고 마지막에 카메라로 D11을 확인하는 방법을 권합니다.

1. 기준: 책상 모서리

로봇 쪽 짧은 변과 선반 쪽 긴 변이 만나는 꼭짓점입니다. verified_1120 기준으로 이 꼭짓점은 로봇 베이스 중심에서 +x 6.6 cm, +y 9.4 cm에 있습니다. 실제로 이 값이 맞는지 먼저 확인해 주세요.

2. 선반 받침판 (600×450) 위치

- 판의 긴 변(600)을 책상 긴 변과 평행하게 놓습니다 (yaw 90°).
- 판의 책상 쪽 긴 변은 책상 긴 변에서 1.6 cm 떨어뜨립니다 (판 y 0.11 m).
- 판 원점 모서리는 책상 짧은 변 연장선에서 +x로 29.4 cm에 둡니다 (베이스 기준 x 0.36 m).
  - 판의 반대쪽 끝은 x −0.09 m로, 책상 옆으로 약 15 cm 걸칩니다.
- 원점 모서리는 전장보드(D20)가 있는 쪽 꼭짓점입니다. E-stop 박스가 같은 긴 변에, 랙 브래킷이 반대쪽(로봇 뒤쪽 x −0.09)에 오는 방향입니다.
  - 이건 조립 가이드의 부품 위치로 추정한 것이니, 실물 선반에서 맞는지 봐 주세요.

        +y (선반 쪽)
  x=-0.09 ┌─────────────── 받침판 ───────────────┐ x=0.36
  (랙)    │        마스트 (0.15, 0.31)           │ ← 원점 모서리 (0.36, 0.11)
          │   D11 (0.003, 0.313)                 │
          └──────────────────────────────────────┘  y=0.11
  ═══════════════ 책상 긴 변 y=0.094 ═══════╗ x=0.066 (책상 끝)
            ● 로봇 베이스 (0,0)             ║        버거 (0.25, -0.05)

3. 선반 축 설정

- X축 캐리지는 이동 범위 맨 끝 −97 mm에 둡니다 (shelf_x −0.097). 기계적 끝점이라 재현이 쉽습니다.
- 포크 돌출량은 0 (fork_y 0)으로 둡니다.
- 포크 높이는 263 mm (맨 아래)입니다. 260~270 mm면 됩니다.

4. 최종 확인 (가장 중요)

- 트레이를 D11에 올리고 카메라로 손잡이를 측정합니다 (detect_pin).
- 목표 위치는 (x +3, y +313) mm, 즉 로봇 정면 +y로 31.3 cm입니다.
- 허용 오차:
  - x: 0 ~ −3 cm만 됩니다. +x(버거 쪽)로 1 cm만 가도 실패하므로, 애매하면 로봇 뒤쪽(−x)으로 1 cm 당겨 두세요.
  - y: 0 ~ +1 cm (로봇에서 멀어지는 쪽)
  - yaw: 88 ~ 90°
- 측정값이 위 범위를 벗어나면 받침판을 옮겨서 맞추면 됩니다.

정리하면, 판은 책상 모서리로 대충 맞추고, 최종 판정은 D11 손잡이의 카메라 측정값으로 합니다. 받침판 위치보다 D11 위치가 인계 성공을 결정하기 때문입니다.
